<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760"><rect width="1300" height="760" fill="#101f30"/><style>text{font-family:Arial,sans-serif;fill:#eaf1f7}.title{font-size:18px;font-weight:bold}.body{font-size:17px}.edge{stroke:#65d7b0;stroke-width:2;fill:none}</style><text x="45" y="48" font-size="28" font-weight="bold">SEATTLE BUILDING ENERGY • RELATIONAL MODEL</text><text x="45" y="78" font-size="16">Real public records · annual observation history · 7 tables · one frozen snapshot</text><path class="edge" d="M345 165 H435"/><text x="350" y="150" font-size="13">1 → many</text><path class="edge" d="M345 310 H435"/><text x="350" y="295" font-size="13">1 → many</text><path class="edge" d="M345 460 H395 V400 H435"/><text x="350" y="490" font-size="13">1 → many</text><path class="edge" d="M615 525 V450"/><text x="625" y="475" font-size="13">many reports</text><text x="625" y="515" font-size="13">1 snapshot</text><path class="edge" d="M795 195 H900"/><text x="805" y="180" font-size="13">1 → many</text><path class="edge" d="M1070 405 V300"/><text x="1080" y="330" font-size="13">many values</text><text x="1080" y="385" font-size="13">1 metric</text><rect x="45" y="110" width="300" height="105" rx="9" fill="#1b3349" stroke="#51738e"/><text class="title" x="61" y="139">BUILDING</text><text class="body" x="61" y="167">PK building_id</text><text class="body" x="61" y="195">Source identity only</text><rect x="45" y="255" width="300" height="110" rx="9" fill="#1b3349" stroke="#51738e"/><text class="title" x="61" y="284">NEIGHBORHOOD</text><text class="body" x="61" y="312">PK neighborhood_id</text><text class="body" x="61" y="340">UNIQUE label</text><rect x="45" y="405" width="300" height="110" rx="9" fill="#1b3349" stroke="#51738e"/><text class="title" x="61" y="434">PROPERTY_USE</text><text class="body" x="61" y="462">PK property_use_id</text><text class="body" x="61" y="490">UNIQUE label</text><rect x="435" y="110" width="360" height="340" rx="9" fill="#1b3349" stroke="#51738e"/><text class="title" x="451" y="139">ANNUAL_REPORT</text><text class="body" x="451" y="167">PK report_id</text><text class="body" x="451" y="195">FK building_id</text><text class="body" x="451" y="223">FK neighborhood_id</text><text class="body" x="451" y="251">FK property_use_id</text><text class="body" x="451" y="279">FK snapshot_id</text><text class="body" x="451" y="307">UNIQUE building_id + year</text><text class="body" x="451" y="335">source_record, building_type</text><text class="body" x="451" y="363">year_built, floors, compliance</text><text class="body" x="451" y="391">demolished</text><rect x="435" y="525" width="360" height="120" rx="9" fill="#1b3349" stroke="#51738e"/><text class="title" x="451" y="554">SOURCE_SNAPSHOT</text><text class="body" x="451" y="582">PK snapshot_id</text><text class="body" x="451" y="610">catalogue, URL, retrieved_date</text><text class="body" x="451" y="638">UNIQUE projected-file SHA-256</text><rect x="900" y="110" width="340" height="190" rx="9" fill="#1b3349" stroke="#51738e"/><text class="title" x="916" y="139">MEASUREMENT</text><text class="body" x="916" y="167">PK / FK report_id</text><text class="body" x="916" y="195">PK / FK metric_code</text><text class="body" x="916" y="223">value, value_status, raw_value</text><text class="body" x="916" y="251">8 expected rows per report</text><text class="body" x="916" y="279">NULL is distinct from zero</text><rect x="900" y="405" width="340" height="150" rx="9" fill="#1b3349" stroke="#51738e"/><text class="title" x="916" y="434">METRIC_DEFINITION</text><text class="body" x="916" y="462">PK metric_code</text><text class="body" x="916" y="490">UNIQUE source_field</text><text class="body" x="916" y="518">label, unit, aggregation_note</text><text x="45" y="710" font-size="17">Report grain: building × year. Measurement grain: report × metric. report_wide pivots before joining.</text><text x="45" y="738" font-size="14">Independent portfolio study • Seattle Open Data teqw-tu6e • Snapshot retrieved October 20, 2026 • Not client work</text></svg>