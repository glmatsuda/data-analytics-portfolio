<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="850" viewBox="0 0 1300 850"><rect width="1300" height="850" fill="#edf3f5"/><g font-family="Arial,sans-serif"><text x="45" y="52" font-size="30" font-weight="bold" fill="#17394b">Fremont crossings | daily data model</text><text x="45" y="85" fill="#526e7e">Independent public-data portfolio · Implemented SQLite schema · 1 → many relationships</text><path d="M350,300 L500,385 M950,300 L800,385" stroke="#16848d" stroke-width="3"/><text x="370" y="300" fill="#16848d">1</text><text x="920" y="300" fill="#16848d">1</text><rect x="45" y="200" width="320" height="130" rx="12" fill="white" stroke="#b9ccd6"/><rect x="45" y="200" width="320" height="42" rx="12" fill="#15394c"/><text x="61" y="227" fill="white" font-weight="bold">dim_station</text><text x="61" y="265" fill="#294b5e" font-size="14">PK station_id</text><text x="61" y="289" fill="#294b5e" font-size="14">station_name</text><text x="61" y="313" fill="#294b5e" font-size="14">source_id</text><rect x="930" y="200" width="320" height="106" rx="12" fill="white" stroke="#b9ccd6"/><rect x="930" y="200" width="320" height="42" rx="12" fill="#15394c"/><text x="946" y="227" fill="white" font-weight="bold">dim_date</text><text x="946" y="265" fill="#294b5e" font-size="14">PK date_key (ISO local date)</text><text x="946" y="289" fill="#294b5e" font-size="14">year / month / iso_weekday</text><rect x="440" y="330" width="420" height="154" rx="12" fill="white" stroke="#b9ccd6"/><rect x="440" y="330" width="420" height="42" rx="12" fill="#15394c"/><text x="456" y="357" fill="white" font-weight="bold">fact_daily_crossings</text><text x="456" y="395" fill="#294b5e" font-size="14">PK + FK station_id + date_key</text><text x="456" y="419" fill="#294b5e" font-size="14">crossings (nullable count)</text><text x="456" y="443" fill="#294b5e" font-size="14">source_rows / valid_rows</text><text x="456" y="467" fill="#294b5e" font-size="14">unique_hours / complete_day</text><text x="45" y="670" fill="#526e7e">Grain: station × calendar date. All dates retained; incomplete days have NULL counts.</text><text x="45" y="700" fill="#526e7e">CHECK: a complete day has 24 rows, 24 valid totals and 24 unique local hour labels.</text></g></svg>