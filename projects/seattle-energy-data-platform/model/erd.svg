<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="850" viewBox="0 0 1300 850"><rect width="1300" height="850" fill="#edf3f5"/><g font-family="Arial,sans-serif"><text x="45" y="52" font-size="30" font-weight="bold" fill="#17394b">Building energy | dimensional model</text><text x="45" y="85" fill="#526e7e">Independent public-data portfolio · Implemented SQLite schema · 1 → many relationships</text><path d="M350,220 L650,430" fill="none" stroke="#16848d" stroke-width="3"/><text x="350" y="212" fill="#16848d">1</text><path d="M350,430 L650,430" fill="none" stroke="#16848d" stroke-width="3"/><text x="350" y="422" fill="#16848d">1</text><path d="M350,650 L650,430" fill="none" stroke="#16848d" stroke-width="3"/><text x="350" y="642" fill="#16848d">1</text><path d="M930,220 L650,430" fill="none" stroke="#16848d" stroke-width="3"/><text x="930" y="212" fill="#16848d">1</text><path d="M930,510 L650,430" fill="none" stroke="#16848d" stroke-width="3"/><text x="930" y="502" fill="#16848d">1</text><rect x="450" y="280" width="400" height="202" rx="12" fill="white" stroke="#b9ccd6"/><rect x="450" y="280" width="400" height="42" rx="12" fill="#15394c"/><text x="466" y="307" fill="white" font-weight="bold">fact_building_energy</text><text x="466" y="345" fill="#294b5e" font-size="14">PK property_id + reporting_year</text><text x="466" y="369" fill="#294b5e" font-size="14">FK use_key / neighborhood_key</text><text x="466" y="393" fill="#294b5e" font-size="14">FK source_key; property_id; year</text><text x="466" y="417" fill="#294b5e" font-size="14">As-reported building context</text><text x="466" y="441" fill="#294b5e" font-size="14">EUI / energy / emissions / status</text><text x="466" y="465" fill="#294b5e" font-size="14">source_row → frozen CSV line</text><rect x="45" y="145" width="290" height="82" rx="12" fill="white" stroke="#b9ccd6"/><rect x="45" y="145" width="290" height="42" rx="12" fill="#15394c"/><text x="61" y="172" fill="white" font-weight="bold">dim_property</text><text x="61" y="210" fill="#294b5e" font-size="14">PK property_id (text)</text><rect x="45" y="350" width="290" height="82" rx="12" fill="white" stroke="#b9ccd6"/><rect x="45" y="350" width="290" height="42" rx="12" fill="#15394c"/><text x="61" y="377" fill="white" font-weight="bold">dim_year</text><text x="61" y="415" fill="#294b5e" font-size="14">PK reporting_year</text><rect x="45" y="570" width="290" height="106" rx="12" fill="white" stroke="#b9ccd6"/><rect x="45" y="570" width="290" height="42" rx="12" fill="#15394c"/><text x="61" y="597" fill="white" font-weight="bold">dim_use_type</text><text x="61" y="635" fill="#294b5e" font-size="14">PK use_key</text><text x="61" y="659" fill="#294b5e" font-size="14">UNIQUE property_use</text><rect x="930" y="145" width="290" height="106" rx="12" fill="white" stroke="#b9ccd6"/><rect x="930" y="145" width="290" height="42" rx="12" fill="#15394c"/><text x="946" y="172" fill="white" font-weight="bold">dim_neighborhood</text><text x="946" y="210" fill="#294b5e" font-size="14">PK neighborhood_key</text><text x="946" y="234" fill="#294b5e" font-size="14">UNIQUE neighborhood</text><rect x="930" y="390" width="290" height="130" rx="12" fill="white" stroke="#b9ccd6"/><rect x="930" y="390" width="290" height="42" rx="12" fill="#15394c"/><text x="946" y="417" fill="white" font-weight="bold">dim_source</text><text x="946" y="455" fill="#294b5e" font-size="14">PK source_key</text><text x="946" y="479" fill="#294b5e" font-size="14">source_id / source_url</text><text x="946" y="503" fill="#294b5e" font-size="14">snapshot_date / SHA-256</text><text x="45" y="770" fill="#526e7e">Grain: one property × reporting year. Historical categories belong to each fact, preserving as-reported context.</text></g></svg>